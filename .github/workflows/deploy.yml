name: Deploy edge functions

# =====================================================================
# SHPËRNDARJA AUTOMATIKE — zëvendëson 11 kopjo-ngjitje me dorë.
#
# PROBLEMI QË ZGJIDH: çdo ndryshim te `supabase/functions/**` duhej çuar
# me dorë, funksion pas funksioni. Kjo prodhoi defekte reale:
#   • kopja e `telegram` mbeti versione prapa dhe askush s'e mori vesh;
#   • një herë SQL-ja u ngjit brenda redaktorit të funksionit (clipboard-i
#     ishte mbishkruar) — gabim që s'jep asnjë sinjal;
#   • asnjë provë se shpërndarja hyri vërtet.
#
# TANI: çdo push në master që prek funksionet i shpërndan VETË të gjithë,
# me cilësimet e JWT-së nga supabase/config.toml, dhe VERIFIKON pastaj.
#
# NEVOJITET NJË HERË: GitHub → Settings → Secrets → Actions → New secret
#   Emri:  SUPABASE_ACCESS_TOKEN
#   Vlera: token nga https://supabase.com/dashboard/account/tokens
# =====================================================================

on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:        # mund të nisët edhe me dorë nga skeda Actions

concurrency:
  group: deploy-functions   # dy shpërndarje njëkohësisht → gjendje e paparashikueshme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rojet para shpërndarjes: kod i prishur NUK duhet të arrijë te klientët.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kontrollo sintaksën e funksioneve
        run: node tools/tscheck.cjs
      - name: Skaneri i dëmtimeve
        run: node tools/damage.cjs
      - name: Testet
        run: node --test

      # `version: latest` e detyron veprimin ta pyesë GitHub API-n për lëshimin e
      # fundit — kërkesë PA autentikim, që godet kufirin e shpejtësisë dhe e rrëzon
      # gjithë shpërndarjen ("Failed to resolve latest Supabase CLI release").
      # GITHUB_TOKEN e jep vetë Actions: e bën kërkesën të autentikuar → pa kufi.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Shpërndaj të gjithë funksionet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref mhbrhrsjlxluxvwjhcne

      # PROVA, jo shpresa: pyet funksionet nëse janë gjallë dhe cilin build kanë.
      - name: Verifiko që hynë
        run: |
          BASE="https://mhbrhrsjlxluxvwjhcne.supabase.co/functions/v1"
          fail=0
          for f in telegram whatsapp chat; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/$f" \
                   -H "Content-Type: application/json" -d '{"ping":1}')
            echo "$f → HTTP $code"
            # 401 do të thoshte se JWT-ja u vu gabimisht ON te një webhook
            if [ "$code" = "401" ]; then echo "❌ $f: JWT ON — webhook-u do vdiste!"; fail=1; fi
            # 404 = funksioni NUK u shpërnda fare. Pikërisht kështu 'whatsapp'
            # mungoi në server për javë të tëra pa e vënë re askush — verifikuesi
            # i mëparshëm e linte 404-ën të kalonte si sukses.
            if [ "$code" = "404" ]; then echo "❌ $f: nuk u shpërnda fare"; fail=1; fi
            if [ "$code" = "000" ]; then echo "❌ $f: nuk përgjigjet fare"; fail=1; fi
          done

          # "Diçka u përgjigj" s'mjafton: kopja e vjetër përgjigjet po aq bindshëm
          # sa e reja (ashtu mbeti 'chat' 6 builde prapa pa asnjë alarm).
          # Prova e vërtetë: numri i build-it në server = numri në kodin që sapo çuam.
          want_chat=$(grep -oE 'BUILD = "[0-9]+"' supabase/functions/chat/index.ts | grep -oE '[0-9]+')
          got_chat=$(curl -s -X POST "$BASE/chat" -H "Content-Type: application/json" -d '{"ping":1}' \
                     | grep -oE '"build":"[0-9]+"' | grep -oE '[0-9]+')
          echo "chat: kodi=$want_chat serveri=$got_chat"
          if [ "$want_chat" != "$got_chat" ]; then echo "❌ chat: serveri mbeti me build të vjetër"; fail=1; fi
          want_tg=$(grep -oE 'build: "[0-9]+"' supabase/functions/telegram/index.ts | grep -oE '[0-9]+')
          got_tg=$(curl -s -X POST "$BASE/telegram" -H "Content-Type: application/json" -d '{"ping":1}' \
                   | grep -oE '"build":"[0-9]+"' | grep -oE '[0-9]+')
          echo "telegram: kodi=$want_tg serveri=$got_tg"
          if [ "$want_tg" != "$got_tg" ]; then echo "❌ telegram: serveri mbeti me build të vjetër"; fail=1; fi

          # Ana tjetër e medaljes: import/refine DUHET të kthejnë 401 pa çelës.
          # Çdo gjë tjetër = JWT u fik gabimisht dhe dera mbeti hapur.
          for f in import refine; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/$f" \
                   -H "Content-Type: application/json" -d '{}')
            echo "$f → HTTP $code (pritet 401)"
            if [ "$code" != "401" ]; then echo "❌ $f: JWT OFF — funksion i brendshëm i ekspozuar!"; fail=1; fi
          done
          exit $fail
